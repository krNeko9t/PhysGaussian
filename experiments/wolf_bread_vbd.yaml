# VBD: wolf (rigid) + bread (soft body)
output: output/wolf_bread_vbd

backend:
  _ref: newton_vbd
  soft_contact_ke: 100.0
  debug_soft_no_deformation: true
  sv_clamp_min: 0.1
  sv_clamp_max: 5.0
  solver: {iterations: 30}

material: {E: 1.0e+5, nu: 0.3, density: 500, mu: 0.5, g: [0, 0, -9.8]}

time: {_ref: default, substep_dt: 2.0e-3, frame_num: 600}
preprocess: {_ref: default, opacity_threshold: 0.1}
camera: {_ref: orbit, init_azimuth: 90, init_elevation: 20, init_radius: 8.0, mpm_space_viewpoint_center: [1, 1, 0.8], delta_a: -1.0, delta_e: 0.0}
particle_filling: default

objects:
  - name: wolf
    ply_path: model/wolf_whitebg-trained/point_cloud/iteration_30000/point_cloud.ply
    material: {physics: rigid, collision_geometry: convex_hull, density: 500, mu: 0.5}

  - name: bread
    ply_path: model/bread-trained/point_cloud/iteration_30000/point_cloud.ply
    position_offset: [0.0, 0.0, 1.0]
    material: {physics: soft, density: 300, k_mu: 1.0e+5, k_lambda: 1.0e+5, k_damp: 1.0e-3}
    particle_filling: {_ref: default, max_particles_per_cell: 16}

boundary_conditions:
  - {type: surface_collider, point: [1, 1, 0.20], normal: [0, 0, 1], surface: sticky, friction: 0.6, start_time: 0, end_time: 1000}
