# VBD simulation: wolf (rigid) + bread (soft body) interaction.
# Migrated from config/wolf_bread_vbd_config.json.
#
# Usage:
#   python pipeline.py --config experiments/wolf_bread_vbd.yaml

hydra:
  searchpath:
    - pkg://physics_sim.conf
defaults:
  - material: sand
  - time: default
  - preprocess: default
  - camera: orbit
  - backend: newton_vbd
  - _self_

output: output/wolf_bread_vbd

# Material defaults
E: 1.0e5
nu: 0.3
density: 500
mu: 0.5
g: [0.0, 0.0, -9.8]

# Time
substep_dt: 2.0e-3
frame_dt: 1.0e-2
frame_num: 600

# Grid
n_grid: 200

# Backend-specific
collision_geometry: convex_hull
contact_margin: 0.01
soft_contact_ke: 100.0
debug_soft_no_deformation: true
sv_clamp_min: 0.1
sv_clamp_max: 5.0
solver:
  iterations: 30

# Preprocessing
preprocess:
  opacity_threshold: 0.1

# Camera
camera:
  camera_mode: orbit
  mpm_space_vertical_upward_axis: [0, 0, 1]
  mpm_space_viewpoint_center: [1, 1, 0.8]
  default_camera_index: -1
  show_hint: false
  init_azimuth: 90
  init_elevation: 20
  init_radius: 8.0
  move_camera: true
  delta_a: -1.0
  delta_e: 0.0
  delta_r: 0.0

# Particle filling (top-level default for objects that don't override it)
particle_filling:
  n_grid: 128
  density_threshold: 20.0
  search_threshold: 0.2
  search_exclude_direction: -1
  ray_cast_direction: 4
  max_particles_num: 500000
  max_particles_per_cell: 4
  boundary: [0.2, 1.8, 0.2, 1.8, 0.2, 1.8]
  smooth: true
  visualize: false

# Objects
objects:
  - name: wolf
    mode: simulate
    source:
      type: ply
      ply_path: model/wolf_whitebg-trained/point_cloud/iteration_30000/point_cloud.ply
    material:
      physics: rigid
      collision_geometry: convex_hull
      density: 500
      mu: 0.5

  - name: bread
    mode: simulate
    source:
      type: ply
      ply_path: model/bread-trained/point_cloud/iteration_30000/point_cloud.ply
    position_offset: [0.0, 0.0, 1.0]
    material:
      physics: soft
      density: 300
      k_mu: 1.0e5
      k_lambda: 1.0e5
      k_damp: 1.0e-3
    particle_filling:
      n_grid: 128
      density_threshold: 20.0
      search_threshold: 0.2
      search_exclude_direction: -1
      ray_cast_direction: 4
      max_particles_num: 500000
      max_particles_per_cell: 16
      boundary: [0.2, 1.8, 0.2, 1.8, 0.2, 1.8]
      smooth: true
      visualize: false

# Boundary conditions
boundary_conditions:
  - type: surface_collider
    point: [1, 1, 0.20]
    normal: [0.0, 0.0, 1.0]
    surface: sticky
    friction: 0.6
    start_time: 0
    end_time: 1000
