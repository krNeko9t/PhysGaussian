# Rigid body: wolf + bread
output: output/wolf_bread_rigid

backend: newton_rigid
material: {E: 1.0e+5, nu: 0.3, density: 1000, mu: 0.5, g: [0, 0, -9.8]}
time: {_ref: default, substep_dt: 1.0e-3}
camera: {_ref: orbit, init_azimuth: 90, init_elevation: 20, init_radius: 3.0, mpm_space_viewpoint_center: [1, 1, 0.8], delta_a: -1.0, delta_e: 0.0}

objects:
  - name: wolf
    ply_path: model/wolf_whitebg-trained/point_cloud/iteration_30000/point_cloud.ply
    material: {density: 500, mu: 0.6}

  - name: bread
    ply_path: model/bread-trained/point_cloud/iteration_30000/point_cloud.ply
    position_offset: [0.0, 0.0, 1.5]
    material: {density: 500, mu: 0.3}

boundary_conditions:
  - {type: surface_collider, point: [1, 1, 0.20], normal: [0, 0, 1], surface: sticky, friction: 0.6, start_time: 0, end_time: 1000}
