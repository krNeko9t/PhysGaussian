# Multi-body rigid simulation: wolf + bread (migrated from
# config/wolf_bread_rigid_config.json).
#
# Usage:
#   python pipeline.py --config experiments/wolf_bread_rigid.yaml

hydra:
  searchpath:
    - pkg://physics_sim.conf
defaults:
  - material: sand
  - time: default
  - preprocess: default
  - camera: orbit
  - backend: newton_rigid
  - _self_

output: output/wolf_bread_rigid

# Material defaults
E: 1.0e5
nu: 0.3
density: 1000
mu: 0.5
g: [0.0, 0.0, -9.8]

# Time
substep_dt: 1.0e-3
frame_dt: 1.0e-2
frame_num: 100

# Grid
n_grid: 200

# Backend-specific (merged at top level — pipeline passes them through)
collision_geometry: convex_hull
use_sdf: false
sdf_resolution: 64
solver:
  iterations: 10
  contact_relaxation: 0.8

# Camera
camera:
  camera_mode: orbit
  mpm_space_vertical_upward_axis: [0, 0, 1]
  mpm_space_viewpoint_center: [1, 1, 0.8]
  default_camera_index: -1
  show_hint: false
  init_azimuth: 90
  init_elevation: 20
  init_radius: 3.0
  move_camera: true
  delta_a: -1.0
  delta_e: 0.0
  delta_r: 0.0

# Objects — each with its own PLY and material overrides
objects:
  - name: wolf
    mode: simulate
    source:
      type: ply
      ply_path: model/wolf_whitebg-trained/point_cloud/iteration_30000/point_cloud.ply
    material:
      density: 500
      mu: 0.6

  - name: bread
    mode: simulate
    source:
      type: ply
      ply_path: model/bread-trained/point_cloud/iteration_30000/point_cloud.ply
    position_offset: [0.0, 0.0, 1.5]
    material:
      density: 500
      mu: 0.3

# Boundary conditions
boundary_conditions:
  - type: surface_collider
    point: [1, 1, 0.20]
    normal: [0.0, 0.0, 1.0]
    surface: sticky
    friction: 0.6
    start_time: 0
    end_time: 1000
