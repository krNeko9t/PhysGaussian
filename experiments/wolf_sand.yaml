# Single-object sand simulation
output: output/wolf_sand

backend: {_ref: warp_mpm, n_grid: 200}
material: sand
time: {_ref: default, substep_dt: 2.0e-5, frame_dt: 4.0e-2, frame_num: 50}
camera: {_ref: orbit, mpm_space_viewpoint_center: [1, 1, 0.8]}

particle_filling:
  _ref: default
  density_threshold: 100.0
  search_threshold: 1.0
  search_exclude_direction: 2
  max_particles_num: 2000000
  max_particles_per_cell: 1
  boundary: [0.4, 1.6, 0.4, 1.6, 0.4, 1.6]
  visualize: true

objects:
  - name: wolf
    ply_path: model/wolf_whitebg-trained/point_cloud/iteration_30000/point_cloud.ply

boundary_conditions:
  - {type: bounding_box}
  - {type: surface_collider, point: [1, 1, 0.48], normal: [0, 0, 1], surface: sticky, friction: 0.0, start_time: 0, end_time: 1000}
  - {type: release_particles_sequentially, normal: [1, 0, 0], start_position: 1.5, end_position: 0.5, num_layers: 50, start_time: 0.0, end_time: 1.5}
